<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Cinzel;
      src: url("./fonts/Cinzel-wght.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0c0d0f;
    }
    .stage {
      width: 1200px;
      height: 630px;
      position: relative;
      background:
        radial-gradient(ellipse 38% 62% at 50% 56%, rgba(196, 92, 74, 0.62) 0%, rgba(196, 92, 74, 0.22) 26%, rgba(12, 13, 15, 0) 58%),
        radial-gradient(ellipse 90% 70% at 50% 115%, rgba(61, 74, 63, 0.35) 0%, transparent 58%),
        linear-gradient(180deg, #16181c 0%, #0c0d0f 42%, #08090a 100%);
      overflow: hidden;
    }
    .woods {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 18% 55% at 8% 100%, #070808 0%, transparent 70%),
        radial-gradient(ellipse 20% 60% at 94% 100%, #070808 0%, transparent 70%),
        radial-gradient(ellipse 14% 40% at 18% 100%, #0a0c0b 0%, transparent 70%),
        radial-gradient(ellipse 16% 48% at 82% 100%, #0a0c0b 0%, transparent 70%);
    }
    .arch {
      position: absolute;
      left: 50%;
      top: 46px;
      transform: translateX(-50%);
      width: 520px;
      height: 560px;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
    }
    .embers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      text-align: center;
      z-index: 4;
      width: 720px;
    }
    .lockup .hollow {
      font-family: Cinzel, "Liberation Serif", serif;
      font-weight: 700;
      font-size: 78px;
      letter-spacing: 0.34em;
      color: #e8e6e1;
      line-height: 1;
      padding-left: 0.34em;
      text-shadow:
        0 0 22px rgba(196, 92, 74, 0.45),
        0 1px 0 rgba(12, 13, 15, 0.9),
        0 10px 28px rgba(12, 13, 15, 0.8);
    }
    .lockup .gate {
      font-family: Cinzel, "Liberation Serif", serif;
      font-weight: 800;
      font-size: 108px;
      letter-spacing: 0.42em;
      color: #e8e6e1;
      line-height: 0.95;
      margin-top: 10px;
      padding-left: 0.42em;
      text-shadow:
        0 0 28px rgba(196, 92, 74, 0.55),
        0 1px 0 rgba(12, 13, 15, 0.9),
        0 14px 32px rgba(12, 13, 15, 0.85);
    }
    .rule {
      width: 220px;
      height: 2px;
      margin: 22px auto 0;
      background: linear-gradient(90deg, transparent, #9aa7b4 18%, #e8e6e1 50%, #9aa7b4 82%, transparent);
      position: relative;
    }
    .rule::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%) rotate(45deg);
      background: #c45c4a;
      box-shadow: 0 0 10px #c45c4a;
    }
    .vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 180px 50px #0c0d0f, inset 0 -70px 90px rgba(12, 13, 15, 0.7);
      pointer-events: none;
      z-index: 5;
    }
    .grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.16;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 6;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="woods"></div>
    <svg class="arch" viewBox="0 0 520 560" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="hollowGlow" cx="50%" cy="62%" r="48%">
          <stop offset="0%" stop-color="#c45c4a" stop-opacity="0.95"/>
          <stop offset="28%" stop-color="#c45c4a" stop-opacity="0.45"/>
          <stop offset="70%" stop-color="#3d4a3f" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#0c0d0f" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#c3ced6"/>
          <stop offset="38%" stop-color="#9aa7b4"/>
          <stop offset="100%" stop-color="#5e6a74"/>
        </linearGradient>
        <linearGradient id="stoneDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6f7b86"/>
          <stop offset="100%" stop-color="#2a3036"/>
        </linearGradient>
      </defs>
      <ellipse cx="260" cy="430" rx="210" ry="28" fill="#070808" opacity="0.55"/>
      <path d="M110 520 V210 C110 92 180 28 260 28 C340 28 410 92 410 210 V520 H368 V216 C368 122 322 72 260 72 C198 72 152 122 152 216 V520 Z" fill="url(#stone)"/>
      <path d="M152 520 V216 C152 122 198 72 260 72 C322 72 368 122 368 216 V520 H330 V222 C330 148 300 108 260 108 C220 108 190 148 190 222 V520 Z" fill="url(#stoneDark)"/>
      <path d="M190 520 V222 C190 148 220 108 260 108 C300 108 330 148 330 222 V520 H190 Z" fill="url(#hollowGlow)"/>
      <path d="M248 28 h24 v48 h-24 z" fill="#b7c2cc"/>
      <path d="M110 210 h18 v310 h-18 z" fill="#7d8a95" opacity="0.35"/>
      <path d="M392 210 h18 v310 h-18 z" fill="#4a555e" opacity="0.45"/>
      <path d="M126 248 l42 -8 8 18 -40 14 z" fill="#3d4a3f"/>
      <path d="M168 92 l36 10 6 16 -40 2 z" fill="#3d4a3f"/>
      <path d="M300 70 l48 18 -8 16 -46 -8 z" fill="#324038"/>
      <path d="M372 180 l28 22 -10 16 -30 -10 z" fill="#3d4a3f"/>
      <path d="M118 400 l22 8 -4 22 -24 -6 z" fill="#2f3a33"/>
      <circle cx="214" cy="64" r="14" fill="#3d4a3f"/>
      <circle cx="198" cy="78" r="9" fill="#2c362f"/>
    </svg>
    <svg class="embers" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="#c45c4a">
        <circle cx="560" cy="390" r="2.2" opacity="0.9"/>
        <circle cx="590" cy="340" r="1.6" opacity="0.7"/>
        <circle cx="630" cy="300" r="2.4" opacity="0.85"/>
        <circle cx="652" cy="248" r="1.4" opacity="0.55"/>
        <circle cx="540" cy="310" r="1.8" opacity="0.6"/>
        <circle cx="610" cy="420" r="2" opacity="0.5"/>
        <circle cx="500" cy="360" r="1.3" opacity="0.45"/>
        <circle cx="670" cy="370" r="1.7" opacity="0.65"/>
        <circle cx="580" cy="220" r="1.2" opacity="0.4"/>
      </g>
    </svg>
    <div class="lockup">
      <div class="hollow">HOLLOW</div>
      <div class="gate">GATE</div>
      <div class="rule"></div>
    </div>
    <div class="vignette"></div>
    <svg class="grain" xmlns="http://www.w3.org/2000/svg">
      <filter id="n">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#n)"/>
    </svg>
  </div>
</body>
</html>
